name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang, tcc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y tcc

      - name: Build and run tests (${{ matrix.compiler }})
        run: |
          make clean
          make test CC=${{ matrix.compiler }}
        timeout-minutes: 10

      - name: Verify static archive exists
        run: test -f lib/libttak.a
